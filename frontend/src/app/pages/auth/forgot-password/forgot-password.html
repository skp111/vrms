<app-navbar></app-navbar>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Forgot Password</h2>
      <p>Reset your password securely</p>
    </div>

    <div *ngIf="error" class="alert alert-error">{{ error }}</div>
    <div *ngIf="success" class="alert alert-success">{{ success }}</div>

    <form (ngSubmit)="onSubmit()" #authForm="ngForm" class="auth-form" [class.loading]="loading">
      
      <div class="form-group">
        <label for="email">Registered Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="formData.email" 
          required
          placeholder="Enter your registered email"
          class="form-control"
          [disabled]="loading"
        >
      </div>

      <div class="form-group">
        <label for="mobile">Registered Mobile Number</label>
        <input 
          type="tel" 
          id="mobile" 
          name="mobile" 
          [(ngModel)]="formData.mobile" 
          required
          placeholder="Enter your 10-digit mobile number"
          class="form-control"
          [disabled]="loading"
        >
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input 
          type="password" 
          id="newPassword" 
          name="newPassword" 
          [(ngModel)]="formData.newPassword" 
          required
          placeholder="Create a strong password"
          class="form-control"
          [disabled]="loading"
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          [(ngModel)]="formData.confirmPassword" 
          required
          placeholder="Re-enter your new password"
          class="form-control"
          [disabled]="loading"
        >
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
        <span *ngIf="!loading">Reset Password</span>
        <span *ngIf="loading">Processing...</span>
      </button>

      <div class="auth-footer">
        <p>Remembered your password? <a routerLink="/login" class="text-link">Back to Login</a></p>
      </div>

    </form>
  </div>
</div>
