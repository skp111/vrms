<div class="auth-container">
  <div class="auth-card">
    <div class="text-center mb-6">
      <a routerLink="/" class="back-link">← Back to Home</a>
      <h2>Create an Account</h2>
      <p>Join RentalSphere today</p>
    </div>

    @if (error) {
      <div class="alert alert-error">
        {{ error }}
      </div>
    }

    @if (success) {
      <div class="alert alert-success">
        Registration successful! Redirecting to login...
      </div>
    }

    @if (!success) {
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            [(ngModel)]="name" 
            placeholder="John Doe"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="email" 
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="password" 
            placeholder="••••••••"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            [(ngModel)]="confirmPassword" 
            placeholder="••••••••"
            required
          >
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number</label>
          <input 
            type="text" 
            id="mobile" 
            name="mobile" 
            [(ngModel)]="mobile" 
            placeholder="1234567890"
            required
          >
        </div>

        <div class="form-group">
          <label for="address">Address</label>
          <input 
            type="text" 
            id="address" 
            name="address" 
            [(ngModel)]="address" 
            placeholder="Your full address"
            required
          >
        </div>

        <div class="form-group">
          <label for="licenseNumber">Driving License Number</label>
          <input 
            type="text" 
            id="licenseNumber" 
            name="licenseNumber" 
            [(ngModel)]="licenseNumber" 
            placeholder="SS-RR-YYYY-NNNNNNN"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary mt-4" [disabled]="isLoading">
          @if (isLoading) {
            <span>Creating account...</span>
          } @else {
            <span>Register</span>
          }
        </button>
      </form>
    }

    <p class="text-center mt-6 register-link">
      Already have an account? <a routerLink="/login" class="link">Sign in</a>
    </p>
  </div>
</div>
