<div class="auth-container">
  <div class="auth-card">
    <div class="text-center mb-6">
      <a routerLink="/" class="back-link">← Back to Home</a>
      <h2>Welcome Back</h2>
      <p>Sign in to your RentalSphere account</p>
    </div>

    @if (error) {
      <div class="alert alert-error">
        {{ error }}
      </div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          placeholder="you@example.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          placeholder="••••••••"
          required
        >
      </div>

      <div class="text-right mt-2" style="margin-top: 0.5rem; text-align: right;">
        <a routerLink="/forgot-password" class="link" style="font-size: 0.875rem;">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-primary mt-4" [disabled]="isLoading">
        @if (isLoading) {
          <span>Signing in...</span>
        } @else {
          <span>Sign In</span>
        }
      </button>
    </form>

    <p class="text-center mt-6 register-link">
      Don't have an account? <a routerLink="/register" class="link">Create one</a>
    </p>
  </div>
</div>
